name: Synchroniser le template GitHub Basics v2

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-github-basics-v2.yml"

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt de test
        uses: actions/checkout@v6
        with:
          path: target
          fetch-depth: 0

      - name: Récupérer le template
        uses: actions/checkout@v6
        with:
          repository: ENSTASIMOV/github-basics
          ref: main
          path: source

      - name: Synchroniser les fichiers
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude '.git' source/ target/

      - name: Réactiver Step 0 avant le push de test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/0-start-exercise.yml" --jq '.state' 2>/dev/null || true)"
          if [ "$state" != "active" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/0-start-exercise.yml/enable"
          fi

      - name: Committer la synchronisation
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Synchroniser GitHub Basics v2"
          git push
