name: Step 2 # Créer un fichier et un commit

on:
  push:
    branches:
      - "my-first-branch"
    paths:
      - "PROFILE.md"

permissions:
  contents: read
  actions: write
  issues: write

env:
  STEP_3_FILE: ".github/steps/3-open-a-pull-request.md"
  TOOLKIT_REPOSITORY: "ENSTASIMOV/exercise-toolkit-fr"
  TOOLKIT_REF: "eab737f3cbe71091795ec3b2342d1640c696d50b"

jobs:
  find_exercise:
    name: Retrouver l'Issue de l'exercice
    uses: ENSTASIMOV/exercise-toolkit-fr/.github/workflows/find-exercise-issue.yml@eab737f3cbe71091795ec3b2342d1640c696d50b

  check_step_work:
    name: Vérifier le fichier et le commit
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Récupérer les templates français
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TOOLKIT_REPOSITORY }}
          path: exercise-toolkit-fr
          ref: ${{ env.TOOLKIT_REF }}

      - name: Retrouver le dernier commentaire de progression
        id: find-last-comment
        uses: peter-evans/find-comment@v3
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Indiquer que le travail est en cours de vérification
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit-fr/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Vérifier que PROFILE.md existe
        id: check-file
        continue-on-error: true
        uses: skills/exercise-toolkit/actions/file-exists@v0.7.1
        with:
          file: PROFILE.md

      - name: Vérifier que PROFILE.md contient Hello
        id: check-content
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v1
        with:
          text-file: PROFILE.md
          keyphrase: Hello
          case-sensitive: false

      - name: Vérifier le message de commit
        id: check-commit-message
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v1
        with:
          text: ${{ github.event.head_commit.message }}
          keyphrase: "Ajouter PROFILE.md"
          case-sensitive: false

      - name: Publier les résultats
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit-fr/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 2
            results_table:
              - description: "Le fichier PROFILE.md existe"
                passed: ${{ steps.check-file.outcome == 'success' }}
              - description: "PROFILE.md contient le mot Hello"
                passed: ${{ steps.check-content.outcome == 'success' }}
              - description: "Le message du commit contient Ajouter PROFILE.md"
                passed: ${{ steps.check-commit-message.outcome == 'success' }}

      - name: Arrêter si une vérification échoue
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Afficher l'étape 3
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Récupérer les templates français
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TOOLKIT_REPOSITORY }}
          path: exercise-toolkit-fr
          ref: ${{ env.TOOLKIT_REF }}

      - name: Confirmer l'étape terminée
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit-fr/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3

      - name: Publier l'étape 3
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_3_FILE }}

      - name: Passer à l'étape 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          current_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/2-commit-a-file.yml" --jq '.state')"
          if [ "$current_state" = "active" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/2-commit-a-file.yml/disable"
          fi

          next_state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/3-open-a-pull-request.yml" --jq '.state')"
          if [ "$next_state" != "active" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/3-open-a-pull-request.yml/enable"
          fi
