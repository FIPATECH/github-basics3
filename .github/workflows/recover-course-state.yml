name: Recovery course state

on:
  push:
    branches:
      - my-first-branch
    paths:
      - ".github/workflows/recover-course-state.yml"

permissions:
  actions: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Remettre les workflows dans l'état attendu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ensure_disabled() {
            local workflow="$1"
            local state
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            if [ "$state" = "active" ]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/disable"
            else
              echo "$workflow déjà désactivé ($state)"
            fi
          }

          ensure_enabled() {
            local workflow="$1"
            local state
            state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}" --jq '.state')"
            if [ "$state" != "active" ]; then
              gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
            else
              echo "$workflow déjà actif"
            fi
          }

          ensure_disabled "0-start-exercise.yml"
          ensure_disabled "1-step.yml"
          ensure_enabled "2-step.yml"
